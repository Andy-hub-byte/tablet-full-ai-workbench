<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 视口设置：width=device-width 保证平板/手机自适应，user-scalable=no 防止双击缩放干扰编辑 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>代码工作台 · Code Studio</title>

<!-- CodeMirror 代码编辑器（CDN 引入；加载失败时自动降级为普通文本框） -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/shell/shell.min.js"></script>

<style>
/* ==========================================================================
 * 全局样式：大按钮、大字号，适配平板触屏
 * ==========================================================================*/
:root {
  --bg: #f5f6f8;          /* 页面背景 */
  --panel: #ffffff;       /* 面板背景 */
  --border: #d8dce3;      /* 边框 */
  --primary: #2563eb;     /* 主色调（运行按钮） */
  --primary-hover: #1d4ed8;
  --danger: #dc2626;
  --text: #1f2937;
  --text-dim: #6b7280;
  --touch-min: 52px;      /* 最小触控高度 */
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  overflow: hidden; /* 页面本身不滚动，由内部面板滚动 */
}

/* ---------------------------------------------------------------- 顶部工具栏 */
.toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}
.toolbar .logo {
  font-size: 1.15rem;
  font-weight: 700;
  margin-right: 8px;
  white-space: nowrap;
}
.toolbar select {
  height: var(--touch-min);
  min-height: var(--touch-min);
  padding: 0 12px;
  font-size: 1rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: #fff;
}
.toolbar .spacer { flex: 1; }

/* 按钮：统一样式，保证触控面积 */
.btn {
  height: var(--touch-min);
  min-width: var(--touch-min);
  padding: 0 16px;
  font-size: 1rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: #fff;
  color: var(--text);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.btn:active { transform: scale(0.96); } /* 按压反馈 */
.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
.btn-primary:active { background: var(--primary-hover); }
.btn-danger { color: var(--danger); }

/* ---------------------------------------------------------------- AI 提示条 */
.ai-bar {
  display: none;               /* 默认隐藏，点击 AI 按钮时展开 */
  padding: 12px 14px;
  background: #eff6ff;
  border-bottom: 1px solid var(--border);
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.ai-bar.show { display: flex; }
.ai-bar input[type="text"] {
  flex: 1;
  min-width: 220px;
  height: var(--touch-min);
  padding: 0 14px;
  font-size: 1rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

/* ---------------------------------------------------------------- 主区域布局 */
.main {
  flex: 1;
  display: flex;
  min-height: 0; /* 允许子面板独立滚动 */
}
.pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.pane + .pane { border-left: 1px solid var(--border); }
.pane-header {
  padding: 8px 14px;
  font-size: 0.92rem;
  font-weight: 600;
  color: var(--text-dim);
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.pane-body { flex: 1; overflow: auto; position: relative; }

/* 编辑区与输出区（竖屏时上下排列，由媒体查询控制） */
#editor { height: 100%; font-size: 15px; }
.CodeMirror { height: 100%; font-size: 15px; font-family: "JetBrains Mono", "Fira Code", Consolas, monospace; }

#output {
  padding: 12px 14px;
  font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
  font-size: 0.95rem;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-all;
  min-height: 100%;
}
#output .placeholder { color: var(--text-dim); font-family: inherit; }
#output .stderr { color: var(--danger); }

/* 输出元信息（退出码 / 耗时） */
.output-meta {
  display: flex;
  gap: 14px;
  padding: 8px 14px;
  border-top: 1px solid var(--border);
  background: var(--panel);
  font-size: 0.88rem;
  color: var(--text-dim);
}
.badge { padding: 2px 10px; border-radius: 999px; font-weight: 600; }
.badge.ok { background: #dcfce7; color: #166534; }
.badge.fail { background: #fee2e2; color: #991b1b; }

/* ---------------------------------------------------------------- 提示气泡 */
#toast {
  position: fixed;
  left: 50%;
  bottom: 26px;
  transform: translateX(-50%);
  background: rgba(17, 24, 39, 0.92);
  color: #fff;
  padding: 12px 20px;
  border-radius: var(--radius);
  font-size: 0.95rem;
  max-width: 86vw;
  display: none;
  z-index: 99;
}

/* ---------------------------------------------------------------- 竖屏适配 */
@media (max-width: 900px) {
  .main { flex-direction: column; }
  .pane + .pane { border-left: none; border-top: 1px solid var(--border); }
  .pane.editor-pane { flex: 1.2; }
  .pane.output-pane { flex: 1; }
}

/* 横屏平板：编辑器与输出左右分栏 */
@media (min-width: 901px) and (orientation: landscape) {
  .pane.editor-pane { flex: 1.15; }
  .pane.output-pane { flex: 1; }
}
</style>
</head>
<body>

<!-- ============================ 顶部工具栏 ============================ -->
<div class="toolbar">
  <span class="logo">💻 代码工作台</span>

  <!-- 语言选择 -->
  <select id="languageSelect" title="选择编程语言">
    <option value="cpp">C++ (g++)</option>
    <option value="python">Python</option>
    <option value="javascript">JavaScript</option>
    <option value="html">HTML</option>
    <option value="shell">Shell</option>
  </select>

  <!-- 模型选择（页面加载后从 Ollama 拉取） -->
  <select id="modelSelect" title="选择 AI 模型">
    <option value="">加载模型中…</option>
  </select>

  <span class="spacer"></span>

  <button class="btn btn-primary" id="runBtn" title="快捷键 Ctrl+Enter">▶ 运行</button>
  <button class="btn" id="generateBtn">✨ AI 生成</button>
  <button class="btn" id="explainBtn">💡 AI 解释</button>
  <button class="btn" id="fixBtn">🔧 AI 修复</button>
  <button class="btn btn-danger" id="clearBtn">🗑 清空</button>
</div>

<!-- ============================ AI 提示输入条 ============================ -->
<div class="ai-bar" id="aiBar">
  <input type="text" id="aiPrompt" placeholder="输入需求，例如：写一个 C++ 程序，输入 10 个数输出最大值">
  <button class="btn btn-primary" id="aiSubmitBtn">发送</button>
  <button class="btn" id="aiCancelBtn">取消</button>
</div>

<!-- ============================ 主区域 ============================ -->
<div class="main">
  <!-- 左：代码编辑区 -->
  <div class="pane editor-pane">
    <div class="pane-header">📝 代码编辑区 <span id="editorHint" style="font-weight:400"></span></div>
    <div class="pane-body">
      <textarea id="editor"></textarea>
    </div>
  </div>

  <!-- 右：输出区 -->
  <div class="pane output-pane">
    <div class="pane-header">📤 运行输出 <span id="previewLink" style="font-weight:400"></span></div>
    <div class="pane-body">
      <div id="output"><span class="placeholder">点击「▶ 运行」或按 Ctrl+Enter 查看输出结果…</span></div>
    </div>
    <div class="output-meta">
      <span>退出码：<span class="badge ok" id="exitCodeBadge">-</span></span>
      <span>耗时：<b id="durationText">-</b></span>
      <span id="langText"></span>
    </div>
  </div>
</div>

<!-- 轻提示气泡 -->
<div id="toast"></div>

<script>
/* ==========================================================================
 * 前端逻辑（全部原生 JS，无构建依赖）
 * ==========================================================================*/
(function () {
  "use strict";

  // ---------------------------------------------------------------- 元素引用
  var editorEl = document.getElementById("editor");
  var outputEl = document.getElementById("output");
  var languageSelect = document.getElementById("languageSelect");
  var modelSelect = document.getElementById("modelSelect");
  var aiBar = document.getElementById("aiBar");
  var aiPrompt = document.getElementById("aiPrompt");
  var exitCodeBadge = document.getElementById("exitCodeBadge");
  var durationText = document.getElementById("durationText");
  var langText = document.getElementById("langText");
  var previewLink = document.getElementById("previewLink");

  // CodeMirror 编辑器实例（CDN 加载失败时为 null，自动降级）
  var cmEditor = null;
  var currentAiAction = null; // 当前 AI 动作：generate / explain / fix

  // ---------------------------------------------------------------- 初始化编辑器
  // 各语言对应的 CodeMirror 模式
  var MODES = {
    cpp: "text/x-c++src",
    python: "python",
    javascript: "javascript",
    html: "xml",
    shell: "shell"
  };

  function initEditor() {
    if (typeof CodeMirror === "undefined") {
      // CDN 不可用（离线环境）：降级为普通文本框，保证基本可用
      editorEl.style.width = "100%";
      editorEl.style.height = "100%";
      editorEl.style.border = "none";
      editorEl.style.padding = "12px";
      editorEl.style.fontFamily = "Consolas, monospace";
      editorEl.style.fontSize = "15px";
      editorEl.style.outline = "none";
      document.getElementById("editorHint").textContent = "（离线模式：基础编辑器）";
      return;
    }
    cmEditor = CodeMirror.fromTextArea(editorEl, {
      mode: MODES[languageSelect.value],
      lineNumbers: true,          // 显示行号
      indentUnit: 4,              // 缩进 4 空格
      tabSize: 4,
      lineWrapping: false,        // 长行横向滚动，不折行
      autoCloseBrackets: true,    // 自动补全括号
      matchBrackets: true,        // 括号高亮匹配
      styleActiveLine: true       // 高亮当前行
    });
  }

  function getCode() {
    return cmEditor ? cmEditor.getValue() : editorEl.value;
  }
  function setCode(code) {
    if (cmEditor) { cmEditor.setValue(code); }
    else { editorEl.value = code; }
  }

  // ---------------------------------------------------------------- 提示气泡
  var toastTimer = null;
  function showToast(message, duration) {
    var toast = document.getElementById("toast");
    toast.textContent = message;
    toast.style.display = "block";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.style.display = "none"; }, duration || 2600);
  }

  // ---------------------------------------------------------------- 加载模型列表
  function loadModels() {
    fetch("/api/models")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        modelSelect.innerHTML = "";
        (data.models || []).forEach(function (name) {
          var opt = document.createElement("option");
          opt.value = name;
          opt.textContent = name;
          modelSelect.appendChild(opt);
        });
        if (!modelSelect.options.length) {
          modelSelect.innerHTML = '<option value="">未找到模型</option>';
        }
      })
      .catch(function () {
        modelSelect.innerHTML = '<option value="">模型加载失败</option>';
      });
  }

  // ---------------------------------------------------------------- 运行代码
  function runCode() {
    var language = languageSelect.value;
    var code = getCode();
    if (!code.trim()) {
      showToast("请先输入代码再运行");
      return;
    }
    showToast("正在运行，请稍候…", 1500);
    fetch("/api/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ language: language, code: code })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) { renderResult(data); })
      .catch(function (e) { showToast("运行请求失败：" + e); });
  }

  // 渲染运行结果
  function renderResult(data) {
    previewLink.innerHTML = "";
    if (data.error) {
      outputEl.innerHTML = '<span class="stderr">' + escapeHtml(data.error) + "</span>";
      exitCodeBadge.textContent = "错误";
      exitCodeBadge.className = "badge fail";
      durationText.textContent = "-";
      return;
    }

    var html = "";
    // 编译错误（C++ 专有）
    if (data.compile_error) {
      html += '<span class="stderr">' + escapeHtml(data.compile_error) + "</span>";
    } else {
      // 标准输出
      html += escapeHtml(data.stdout || "（无输出）");
      // 标准错误（有内容才展示）
      if (data.stderr && data.stderr.trim()) {
        html += '\n<span class="stderr">' + escapeHtml(data.stderr) + "</span>";
      }
    }
    outputEl.innerHTML = html;

    // 元信息：退出码 / 耗时 / 语言
    var ok = data.exit_code === 0 && !data.compile_error;
    exitCodeBadge.textContent = data.compile_error ? "编译失败" : (data.exit_code === 0 ? "成功" : "退出码 " + data.exit_code);
    exitCodeBadge.className = "badge " + (ok ? "ok" : "fail");
    durationText.textContent = (data.duration_ms || 0) + " ms";
    langText.textContent = "语言：" + languageSelect.options[languageSelect.selectedIndex].text;

    // HTML 语言：展示预览链接
    if (data.preview_url) {
      previewLink.innerHTML = ' · <a href="' + data.preview_url + '" target="_blank" style="color:var(--primary)">打开预览 ↗</a>';
    }
  }

  function escapeHtml(text) {
    var div = document.createElement("div");
    div.textContent = text == null ? "" : String(text);
    return div.innerHTML;
  }

  // ---------------------------------------------------------------- AI 功能
  // 打开 AI 输入条
  function openAiBar(action) {
    currentAiAction = action;
    aiBar.classList.add("show");
    aiPrompt.placeholder = {
      generate: "输入需求，例如：写一个 C++ 程序，输入 10 个数输出最大值",
      explain: "将解释编辑器中的代码（无需输入，直接点发送）",
      fix: "将修复编辑器中的代码（无需输入，直接点发送）"
    }[action];
    aiPrompt.focus();
  }
  function closeAiBar() {
    aiBar.classList.remove("show");
    aiPrompt.value = "";
    currentAiAction = null;
  }

  function submitAi() {
    var code = getCode();
    // explain / fix 需要有代码；generate 用需求描述
    if (currentAiAction !== "generate" && !code.trim()) {
      showToast("请先输入需要" + (currentAiAction === "fix" ? "修复" : "解释") + "的代码");
      return;
    }
    var prompt = aiPrompt.value.trim();
    if (currentAiAction === "generate" && !prompt) {
      showToast("请先输入代码需求");
      return;
    }

    var btnText = { generate: "AI 正在生成代码", explain: "AI 正在分析代码", fix: "AI 正在修复代码" }[currentAiAction];
    showToast(btnText + "，大模型推理需要耐心等待…", 60000);

    fetch("/api/ai", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        action: currentAiAction,
        language: languageSelect.options[languageSelect.selectedIndex].text.split(" ")[0],
        code: code,
        prompt: prompt,
        model: modelSelect.value
      })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.error) {
          showToast(data.error, 8000);
          return;
        }
        // 生成/修复：把代码填入编辑器；解释：展示在输出区
        if (currentAiAction === "explain") {
          outputEl.textContent = data.content;
          exitCodeBadge.textContent = "AI 讲解";
          exitCodeBadge.className = "badge ok";
        } else {
          setCode(data.code || data.content);
          showToast("代码已填入编辑器 ✅");
        }
        closeAiBar();
      })
      .catch(function (e) { showToast("AI 请求失败：" + e, 8000); });
  }

  // ---------------------------------------------------------------- 事件绑定
  document.getElementById("runBtn").addEventListener("click", runCode);
  document.getElementById("generateBtn").addEventListener("click", function () { openAiBar("generate"); });
  document.getElementById("explainBtn").addEventListener("click", function () { openAiBar("explain"); });
  document.getElementById("fixBtn").addEventListener("click", function () { openAiBar("fix"); });
  document.getElementById("clearBtn").addEventListener("click", function () {
    setCode("");
    outputEl.innerHTML = '<span class="placeholder">已清空，等待运行…</span>';
    exitCodeBadge.textContent = "-";
    exitCodeBadge.className = "badge ok";
    durationText.textContent = "-";
    previewLink.innerHTML = "";
  });
  document.getElementById("aiSubmitBtn").addEventListener("click", submitAi);
  document.getElementById("aiCancelBtn").addEventListener("click", closeAiBar);

  // 输入框回车直接发送（Shift+Enter 换行）
  aiPrompt.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      submitAi();
    }
  });

  // Ctrl+Enter 全局运行快捷键
  document.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      runCode();
    }
    if (e.key === "Escape") { closeAiBar(); }
  });

  // 切换语言时同步编辑器语法高亮模式
  languageSelect.addEventListener("change", function () {
    if (cmEditor) { cmEditor.setOption("mode", MODES[languageSelect.value]); }
  });

  // ---------------------------------------------------------------- 启动
  initEditor();
  loadModels();
})();
</script>
</body>
</html>
